name: Build and upload artefacts on all platforms

on:
  # push:
  #   branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
        # os: [ubuntu-24.04, ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Executable
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: app.py
          mode: onefile
          enable-plugins: pyside6
          include-module: polars,yaml,xlsxwriter,numpy
          nofollow-import-to: ipython
          windows-icon-from-ico: assets/icon.ico
          linux-icon: assets/icon.ico
          macos-app-icon: assets/icon.ico
          include-data-dir: assets=assets
          disable-console: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }} Build
          path: |
            build/*.exe
            build/*.bin
            build/*.app/**/*
